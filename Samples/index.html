<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WER Reports — Home</title>
<style>
  :root {
    --line: #e5e7eb;
    --muted: #6b7280;
    --head: #111827;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f8fafc;
    color: #1f2937;
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", sans-serif;
  }
  header {
    background: #111827;
    color: #fff;
    padding: 18px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
  }
  header p {
    margin: 6px 0 0;
    color: #9ca3af;
    font-size: 14px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  .view { display: none; }
  .view.active { display: block; }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
    padding: 8px 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--head);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s;
  }
  .back-btn:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }
  .options {
    display: grid;
    gap: 16px;
  }
  .option-card {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px 24px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s, box-shadow .15s, transform .1s;
  }
  .option-card:hover {
    border-color: #93c5fd;
    box-shadow: 0 4px 16px rgba(37,99,235,.12);
    transform: translateY(-1px);
  }
  .option-card .icon {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 24px;
  }
  .option-card.pure .icon {
    background: #dbeafe;
    color: #1d4ed8;
  }
  .option-card.mixed .icon {
    background: #ede9fe;
    color: #6d28d9;
  }
  .option-card.sample .icon {
    background: #ecfdf5;
    color: #047857;
  }
  .option-card .text h2 {
    margin: 0 0 4px;
    font-size: 18px;
    color: var(--head);
  }
  .option-card .text p {
    margin: 0;
    font-size: 14px;
    color: var(--muted);
  }
  .option-card .arrow {
    margin-left: auto;
    color: #9ca3af;
    font-size: 20px;
  }
  .section-title {
    margin: 0 0 20px;
    font-size: 16px;
    color: var(--muted);
    font-weight: 500;
  }
</style>
</head>
<body>
<header>
  <h1>WER Report Samples</h1>
  <p>Choose a language category to view word error rate reports</p>
</header>

<main>
  <!-- Home -->
  <div id="home" class="view active">
    <div class="options">
      <div class="option-card pure" onclick="showView('pure-urdu')">
        <div class="icon">ا</div>
        <div class="text">
          <h2>Pure Urdu</h2>
          <p>Urdu-only transcription samples</p>
        </div>
        <span class="arrow">›</span>
      </div>
      <a class="option-card mixed" href="mix1.html">
        <div class="icon">⇄</div>
        <div class="text">
          <h2>Mixed</h2>
          <p>Urdu-English bilingual report</p>
        </div>
        <span class="arrow">›</span>
      </a>
    </div>
  </div>

  <!-- Pure Urdu samples -->
  <div id="pure-urdu" class="view">
    <button class="back-btn" type="button" onclick="showView('home')">← Back to Home</button>
    <p class="section-title">Select a Pure Urdu sample</p>
    <div class="options">
      <a class="option-card sample" href="ur1.html">
        <div class="icon">1</div>
        <div class="text">
          <h2>Sample 1</h2>
          <p>WER 6.83% — r.txt vs gt.txt</p>
        </div>
        <span class="arrow">›</span>
      </a>
      <a class="option-card sample" href="ur2.html">
        <div class="icon">2</div>
        <div class="text">
          <h2>Sample 2</h2>
          <p>WER 13.03% — machine transcription</p>
        </div>
        <span class="arrow">›</span>
      </a>
    </div>
  </div>
</main>

<script>
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
